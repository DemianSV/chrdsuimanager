services:
  chrdsuimanager01:
    image: chrdsuimanager:latest
    ports:
      - 127.0.0.1:7007:7007
    container_name: chrdsuimanager01
    networks:
      cassandra_net:
        ipv4_address: 172.30.0.20

    restart: always
    environment:
    - CHRDS_UIMANAGER_MODULEID=623a57c2-3df5-4287-ada5-82f7e4a0b5db
    - CHRDS_UIMANAGER_SPACEID ID=17f0bd20-41cf-4801-a481-ff721a41fa93
    - CHRDS_UIMANAGER_DATAMANAGERURL=http://172.30.0.10:6006,http://172.30.0.11:6006
    - CHRDS_HTTP_HOST=0.0.0.0
    - CHRDS_HTTP_PORT=7007
    - CHRDS_HTTP_READTIMEOUT=30
    - CHRDS_HTTP_WRITETIMEOUT=30
    - CHRDS_HTTP_RL=100
    - CHRDS_HTTP_TLS=false
    - CHRDS_HTTP_CERTPATH=
    - CHRDS_HTTP_KEYPATH=
    - CHRDS_HTTP_CAPATH=
    - CHRDS_HTTP_CLIENTINSECURE=true
    - CHRDS_DB_HOST=172.30.0.2:9042,172.30.0.3:9042,172.30.0.4:9042
    - CHRDS_DB_USERNAME=chrds
    - CHRDS_DB_PASSWORD=chrds
    - CHRDS_DB_TLS=false
    - CHRDS_DB_CERTPATH=
    - CHRDS_DB_KEYPATH=
    - CHRDS_DB_CAPATH=
    - CHRDS_DB_HOSTVERIFICATION=false
    - CHRDS_DB_KEYSPACE=chrds
    - CHRDS_DB_CONSISTENCY=One
    - CHRDS_DB_CONSISTENCYREAD=One
    - CHRDS_DB_TIMEOUT=30000
networks:
  cassandra_net:
    name: cassandra_net
    external: true
